<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Планы и Задачи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Панель управления</h1>
        
        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('plans')">📊 Планы</button>
            <button class="tab-btn" onclick="switchTab('tasks')">📝 Задачи</button>
        </div>

        <!-- Раздел Планы -->
        <div id="tab-plans" class="tab-content active">
            <div class="card">
                <h3>Выставить план на период</h3>
                <div class="date-range">
                    <div>
                        <label>С даты</label>
                        <input type="date" id="plan-start-date">
                    </div>
                    <div>
                        <label>По дату</label>
                        <input type="date" id="plan-end-date">
                    </div>
                </div>
                <div class="grid-inputs">
                    <input type="number" id="plan-sim" placeholder="СИМ (шт)">
                    <input type="number" id="plan-abon" placeholder="Абонементы (шт)">
                    <input type="number" id="plan-tovar" placeholder="Товарка (₽)">
                    <input type="number" id="plan-aks" placeholder="Аксессуары (₽)">
                    <input type="number" id="plan-finka" placeholder="Финка (₽)">
                </div>
                <button class="btn-primary" onclick="addPlan()">Сохранить план</button>
            </div>
            <h3>Текущие планы</h3>
            <div id="plans-list" class="list"></div>
        </div>

                <!-- Раздел Задачи -->
        <div id="tab-tasks" class="tab-content">
            <div class="card">
                <h3>Создать задачу с напоминаниями</h3>
                <input type="text" id="task-name" placeholder="Название (Продать кредитную карту)">
                <input type="number" id="task-user-id" placeholder="ID общего чата или сотрудника">
                <select id="task-interval">
                    <option value="0">Без напоминаний (разовая)</option>
                    <option value="60">Каждый 1 час</option>
                    <option value="120">Каждые 2 часа</option>
                    <option value="180">Каждые 3 часа</option>
                </select>
                <button class="btn-primary" onclick="addTask()">Создать задачу</button>
            </div>
            <h3>Активные задачи</h3>
            <div id="tasks-list" class="list"></div>
        </div>

    <!-- Модальное окно для редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>Редактировать план</h3>
            <input type="hidden" id="edit-id">
            <div class="grid-inputs">
                <input type="number" id="edit-sim" placeholder="СИМ">
                <input type="number" id="edit-abon" placeholder="Абонементы">
                <input type="number" id="edit-tovar" placeholder="Товарка">
                <input type="number" id="edit-aks" placeholder="Аксессуары">
                <input type="number" id="edit-finka" placeholder="Финка">
            </div>
            <div class="modal-actions">
                <button class="btn-danger" onclick="closeModal()">Отмена</button>
                <button class="btn-primary" onclick="saveEdit()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
